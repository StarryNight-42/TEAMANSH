<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KRISHI SETU</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f6ed;color:#173d2d;font-family:Arial,sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:24px 7%;border-bottom:1px solid #dce1d2}strong.logo{font-size:24px;letter-spacing:2px}small{display:block;color:#657765;letter-spacing:2px}button{font:inherit;cursor:pointer}header button,.outline{border:1px solid #315d43;background:transparent;color:#173d2d;padding:12px 22px;border-radius:40px}main{max-width:1200px;margin:auto;padding:65px 25px} .intro{text-align:center;animation:rise .7s both}.eyebrow{font-size:12px;letter-spacing:3px;color:#657765}h1{font-family:Georgia,serif;font-size:clamp(42px,7vw,80px);font-weight:400;line-height:1;margin:20px 0}h1 em{color:#78934d}p{line-height:1.6;color:#657765}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:45px}.card{border:1px solid #dce1d2;border-radius:22px;overflow:hidden;background:#fffdf6;transition:transform .35s,box-shadow .35s;animation:rise .8s both}.card:nth-child(2){animation-delay:.12s}.card:nth-child(3){animation-delay:.24s}.card:hover{transform:translateY(-9px);box-shadow:0 22px 45px #173d2d22}.art{height:220px;overflow:hidden;background:#dce8cb}.art svg{width:100%;height:100%;transition:transform .65s}.card:hover svg{transform:scale(1.1)}.copy{padding:25px}.copy h2{font-family:Georgia,serif;font-size:30px;margin:12px 0}.copy p{min-height:76px;font-size:15px}.primary{background:#214c35;color:white;border:0;border-radius:40px;padding:14px 22px;width:100%;transition:background .2s}.primary:hover{background:#477547}footer{text-align:center;padding:25px;border-top:1px solid #dce1d2;font-size:12px;color:#657765}dialog{border:0;border-radius:25px;padding:32px;width:min(440px,92vw);background:#fffdf6;color:#173d2d;box-shadow:0 30px 90px #0004}dialog[open]{animation:pop .3s both}dialog::backdrop{background:#102c23aa;backdrop-filter:blur(6px)}.close{float:right;border:0;background:#e9eddf;border-radius:50%;width:34px;height:34px}.tabs{display:flex;background:#e9eddf;border-radius:30px;padding:4px;margin:22px 0}.tabs button{flex:1;border:0;border-radius:30px;padding:10px;background:transparent;color:#315d43}.tabs .active{background:white;box-shadow:0 2px 8px #0001}label{display:block;font-size:13px;margin:14px 0 6px}input{width:100%;padding:14px;border:1px solid #cdd7c6;border-radius:10px;background:white;font:inherit}input:focus{outline:2px solid #78934d}.hint{background:#edf1e4;padding:12px;border-radius:12px;font-size:12px;margin:16px 0}.error{color:#a33232;font-size:13px}#dashboard{display:none;text-align:center;padding:60px 10px}@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}@keyframes pop{from{opacity:0;transform:scale(.85) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}@media(max-width:700px){.cards{grid-template-columns:1fr}main{padding-top:35px}.copy p{min-height:0}.art{height:190px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style><header><div><strong class="logo">✳ KRISHI SETU</strong><small>कृषि सेतु · NEPAL</small></div><button id="top">Get started ↗</button></header><main><section id="landing"><div class="intro"><div class="eyebrow">ROOTED IN NEPAL · BUILT FOR EVERYONE</div><h1>From farm<br>to <em>future.</em></h1><p>One bridge between growers, distributors and buyers.<br>Choose your role to get started.</p></div><div class="cards" id="cards"></div></section><section id="dashboard"><div class="eyebrow">DEMO WORKSPACE</div><h1 id="welcome"></h1><p id="services"></p><button class="outline" id="logout">Log out</button></section></main><footer>KRISHI SETU © 2026 · Connecting Nepal's agricultural ecosystem · Demo</footer><dialog id="modal"><button class="close" aria-label="Close" id="close">×</button><small id="roleLabel"></small><h2 id="heading">Welcome back</h2><div class="tabs"><button id="loginTab" class="active">Login</button><button id="signupTab">Sign up</button></div><form id="auth"><div id="nameField" hidden><label for="name">Full name</label><input id="name" autocomplete="name"></div><label for="email">Email address</label><input id="email" type="email" required autocomplete="username" placeholder="you@example.com"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"><div class="hint" id="hint"></div><div class="error" id="error" role="alert"></div><button class="primary" id="submit">Login →</button></form></dialog><script>
const $=id=>document.getElementById(id);const roles=[['Farmer','किसान','Grow your business. Sell your harvest and discover better market opportunities.','famer@gmail.com','farmer','Sell crops · Market prices · Fertilizer and seeds'],['Transporter','ढुवानीकर्ता','Connect farms with markets through reliable collection and distribution.','transporter@gmail.com','transporter','Collection requests · Deliveries · Earnings'],['Distributor','वितरक','Discover fresh produce, connect with growers and purchase with confidence.','distributor@gmail.com','distributor','Browse produce · Orders · Payments']];let selected=0,signup=false;const art=[`<circle cx="245" cy="65" r="38" fill="#f4d48a"/><path d="M0 150 Q80 35 180 150 T360 120 V240 H0" fill="#83a76c"/><path d="M0 175 Q180 90 360 180 V240 H0" fill="#3f754b"/><path d="M180 240 L230 150 M80 240 L160 160 M300 240 L280 170" stroke="#d5dba1" stroke-width="12"/><circle cx="150" cy="100" r="23" fill="#b87950"/><path d="M112 100 Q150 56 188 100" fill="#e5c37d"/><path d="M122 180 L125 125 Q150 110 175 125 L185 180" fill="#f5e8c7"/>`,`<circle cx="280" cy="50" r="34" fill="#f3d58d"/><path d="M0 150 Q90 45 180 150 T360 120 V240 H0" fill="#8ba77b"/><rect y="175" width="360" height="65" fill="#65776a"/><path d="M0 210 H360" stroke="#eee9ce" stroke-width="3" stroke-dasharray="22 15"/><rect x="55" y="95" width="155" height="92" rx="8" fill="#e9c67f"/><path d="M210 125 H260 L300 160 V187 H210Z" fill="#285d42"/><path d="M225 135 H255 L275 157 H225Z" fill="#c8e1d8"/><circle cx="105" cy="190" r="20" fill="#243c32"/><circle cx="260" cy="190" r="20" fill="#243c32"/>`,`<circle cx="180" cy="115" r="90" fill="#f3e4b6"/><path d="M85 125 H275 L250 205 H110Z" fill="#b58a51"/><path d="M125 130 Q180 25 235 130" fill="none" stroke="#805b37" stroke-width="10"/><circle cx="140" cy="120" r="33" fill="#cb6349"/><circle cx="205" cy="115" r="37" fill="#d98243"/><path d="M175 130 Q130 30 190 65 Q235 40 220 130" fill="#578a4d"/><path d="M110 155 H260 M115 180 H255" stroke="#e3c78b" stroke-width="7"/>`];$('cards').innerHTML=roles.map((r,i)=>`<article class="card"><div class="art"><svg viewBox="0 0 360 240" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${art[i]}</svg></div><div class="copy"><small>0${i+1} / ${r[1]}</small><h2>${r[0]}</h2><p>${r[2]}</p><button class="primary" data-role="${i}">Join as ${r[0]} →</button></div></article>`).join('');function mode(s){signup=s;$('loginTab').classList.toggle('active',!s);$('signupTab').classList.toggle('active',s);$('nameField').hidden=!s;$('name').required=s;$('heading').textContent=s?'Create your account':'Welcome back';$('submit').textContent=s?'Create demo account →':'Login →';$('hint').textContent=s?'Demo signup only. No account is saved. Use the fixed credentials to log in.':`Demo email: ${roles[selected][3]} · Password: ${roles[selected][4]}`;$('error').textContent=''}function openRole(i){selected=i;$('auth').reset();$('roleLabel').textContent=roles[i][0]+' / '+roles[i][1];mode(false);$('modal').showModal()}document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>openRole(+b.dataset.role));$('close').onclick=()=>$('modal').close();$('loginTab').onclick=()=>mode(false);$('signupTab').onclick=()=>mode(true);$('top').onclick=()=>$('cards').scrollIntoView({behavior:'smooth'});$('auth').onsubmit=e=>{e.preventDefault();let r=roles[selected];if(signup){mode(false);$('error').textContent='Demo signup completed; no account stored. Please use the fixed demo login.';return}if(($('email').value.trim().toLowerCase()===r[3]||(selected===0&&$('email').value.trim().toLowerCase()==='farmer@gmail.com'))&&$('password').value===r[4]){$('modal').close();$('landing').style.display='none';$('dashboard').style.display='block';$('welcome').textContent='Welcome, '+r[0];$('services').textContent=r[5]}else $('error').textContent='Incorrect email or password for this role.'};$('logout').onclick=()=>{$('dashboard').style.display='none';$('landing').style.display='block'};
</script></html>
