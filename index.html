
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KrishiSetu | From Farm to Future</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f7f8f1;
    color: #253c2d;
}

header {
    height: 75px;
    padding: 0 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff;
    border-bottom: 1px solid #e7eadf;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    color: #267442;
}

.logo span {
    color: #d49a39;
}

.hero {
    text-align: center;
    padding: 65px 20px 35px;
}

.hero h1 {
    font-size: clamp(32px, 5vw, 49px);
    margin-bottom: 15px;
}

.hero h1 span {
    color: #36834d;
}

.hero p {
    color: #718071;
    font-size: 16px;
    line-height: 1.6;
}

.cards {
    max-width: 1100px;
    margin: 35px auto 70px;
    padding: 0 20px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
}

.card {
    background: white;
    border: 1px solid #e8ecdf;
    border-radius: 15px;
    padding: 30px 23px;
    text-align: center;
    transition: .25s;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 30px #203b2412;
}

.art {
    width: 75px;
    height: 75px;
    margin: 0 auto 20px;
    background: #edf5e9;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 35px;
}

.card h2 {
    font-size: 22px;
    margin-bottom: 10px;
}

.card p {
    color: #7b8879;
    font-size: 14px;
    line-height: 1.6;
    min-height: 45px;
}

.card button {
    width: 100%;
    margin-top: 23px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #32834c;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.card button:hover {
    background: #24683b;
}

footer {
    text-align: center;
    padding: 22px;
    color: #899184;
    border-top: 1px solid #e7eadf;
    font-size: 13px;
}

/* Modal */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #142219a8;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.modal-box {
    background: white;
    width: 100%;
    max-width: 410px;
    padding: 32px;
    border-radius: 15px;
    position: relative;
}

.close {
    position: absolute;
    right: 20px;
    top: 15px;
    font-size: 25px;
    cursor: pointer;
    color: #777;
}

.modal-box h2 {
    margin-bottom: 8px;
}

.subtitle {
    color: #879184;
    font-size: 14px;
    margin-bottom: 23px;
}

.modal-box input {
    width: 100%;
    padding: 13px;
    margin-bottom: 14px;
    border: 1px solid #dfe5d9;
    border-radius: 8px;
    outline: none;
}

.modal-box input:focus {
    border-color: #32834c;
}

.submit {
    width: 100%;
    padding: 13px;
    background: #32834c;
    border: none;
    border-radius: 8px;
    color: white;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
}

.switch {
    margin-top: 20px;
    text-align: center;
    font-size: 14px;
    color: #788477;
}

.switch span {
    color: #32834c;
    font-weight: bold;
    cursor: pointer;
}

#message {
    margin-top: 12px;
    font-size: 13px;
    text-align: center;
    color: #c0392b;
}

@media(max-width: 850px) {
    .cards {
        grid-template-columns: 1fr 1fr;
    }
}

@media(max-width: 600px) {
    header {
        padding: 0 20px;
    }

    .cards {
        grid-template-columns: 1fr;
        max-width: 400px;
    }

    .hero {
        padding-top: 45px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">KRISHI<span>SETU</span></div>
</header>

<section class="hero">
    <h1>From Farm <span>to Future.</span></h1>
    <p>
        Connecting farmers, transporters and distributors
        for a better agricultural network.
    </p>
</section>

<section class="cards" id="cards"></section>

<footer>
    © 2026 KrishiSetu. Connecting Agriculture, Empowering People.
</footer>

<!-- Login / Registration Modal -->

<div class="modal" id="modal">
    <div class="modal-box">
        <span class="close" onclick="closeModal()">&times;</span>

        <h2 id="formTitle">Welcome Back</h2>
        <p class="subtitle" id="formSubtitle">
            Login to your KrishiSetu account.
        </p>

        <form id="authForm">
            <input
                type="text"
                id="name"
                placeholder="Full Name"
                style="display:none"
            >

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password (minimum 8 characters)"
                minlength="8"
                required
            >

            <button type="submit" class="submit" id="submitBtn">
                Login
            </button>
        </form>

        <p id="message"></p>

        <div class="switch">
            <span id="switchText">Don't have an account?</span>
            <span onclick="switchMode()" id="switchButton">
                Create Account
            </span>
        </div>
    </div>
</div>

<script>
const roles = [
    {
        name: "Farmer",
        role: "farmer",
        description: "Manage your agricultural products and connect with distributors.",
        icon: "🌾"
    },
    {
        name: "Transporter",
        role: "transporter",
        description: "Manage transportation and deliver agricultural products.",
        icon: "🚚"
    },
    {
        name: "Distributor",
        role: "distributor",
        description: "Connect with farmers and manage product distribution.",
        icon: "🏪"
    }
];

const dashboards = {
    farmer: "farmer.html",
    transporter: "transporter.html",
    distributor: "distributor.html"
};

let selectedRole = "";
let signupMode = false;

const cards = document.getElementById("cards");

roles.forEach(item => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
        <div class="art">${item.icon}</div>
        <h2>${item.name}</h2>
        <p>${item.description}</p>
        <button type="button">Continue as ${item.name}</button>
    `;

    card.querySelector("button").addEventListener("click", () => {
        openModal(item.role);
    });

    cards.appendChild(card);
});

function openModal(role) {
    selectedRole = role;
    signupMode = false;

    document.getElementById("modal").style.display = "flex";
    updateForm();
}

function closeModal() {
    document.getElementById("modal").style.display = "none";
    document.getElementById("authForm").reset();
    document.getElementById("message").textContent = "";
}

function switchMode() {
    signupMode = !signupMode;
    updateForm();
}

function updateForm() {
    document.getElementById("formTitle").textContent =
        signupMode ? "Create Account" : "Welcome Back";

    document.getElementById("formSubtitle").textContent =
        signupMode
        ? "Register your KrishiSetu account."
        : "Login to your KrishiSetu account.";

    document.getElementById("name").style.display =
        signupMode ? "block" : "none";

    document.getElementById("name").required = signupMode;

    document.getElementById("submitBtn").textContent =
        signupMode ? "Register" : "Login";

    document.getElementById("switchText").textContent =
        signupMode ? "Already have an account?" : "Don't have an account?";

    document.getElementById("switchButton").textContent =
        signupMode ? "Login" : "Create Account";

    document.getElementById("message").textContent = "";
}

document.getElementById("authForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const message = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;

    submitBtn.disabled = true;
    submitBtn.textContent = "Please wait...";
    message.textContent = "";

    try {
        if (signupMode) {
            const name = document.getElementById("name").value.trim();

            const response = await fetch("/api/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name,
                    email,
                    password,
                    role: selectedRole
                })
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.error || "Registration failed.");
            }

            signupMode = false;
            updateForm();

            document.getElementById("email").value = email;
            message.style.color = "#32834c";
            message.textContent = "Registration successful! Please login.";

        } else {
            const response = await fetch("/api/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email,
                    password
                })
            });

            const data = await response.json();

            if (!response.ok || !data.success || !data.user) {
                throw new Error(data.error || "Invalid email or password.");
            }

            if (data.user.role !== selectedRole) {
                await fetch("/api/logout", {
                    method: "POST"
                });

                throw new Error(
                    "This account belongs to a different account type."
                );
            }

            window.location.href = dashboards[selectedRole];
        }

    } catch (error) {
        message.style.color = "#c0392b";
        message.textContent = error.message || "Something went wrong.";
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = signupMode ? "Register" : "Login";
    }
});

window.addEventListener("click", function(e) {
    if (e.target === document.getElementById("modal")) {
        closeModal();
    }
});
</script>

</body>
</html>
